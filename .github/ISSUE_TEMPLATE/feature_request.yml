name: Feature request
description: 提出一个功能或改进
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 如果涉及新工具，请说明参数、输出与安全边界
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
