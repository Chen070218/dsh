name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install dependencies (lockfile-pinned)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check shipped sources
        run: npx tsc --noEmit -p tsconfig.json

  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install (no lifecycle scripts; build runs explicitly)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build (Node built-in type stripping)
        run: npm run build
      - name: Tests that do not need a DSH installation (incl. tool-layer contract tests via mock)
        run: npm run test:ci
      - name: Metadata self-check
        run: node scripts/check-metadata.mjs
      - name: Pack contents (files allowlist)
        run: npm run check:pack
      - name: Lint (erasable syntax / console / any / whitespace)
        run: npm run lint
      - name: Coverage gate (statements >= 80%)
        run: npm run check:coverage
      - name: Smoke demos
        run: |
          node scripts/demo-scan.mjs
          node scripts/demo-analyze.mjs
