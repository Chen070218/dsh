name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance（供应链签名）需要

jobs:
  publish:
    name: build, test and publish to npm
    runs-on: ubuntu-latest
    env:
      # secrets 不能在步骤的 if 里直接读，必须先提到 job 级 env
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - name: Install (lockfile-pinned)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          pkg_version=$(node -p "require('./package.json').version")
          tag_version="${{ github.ref_name }"
          if [ "v$pkg_version" != "$tag_version" ]; then
            echo "标签 $tag_version 与 package.json 版本 v$pkg_version 不一致" >&2
            exit 1
          fi
      - name: Preflight (build, typecheck, tests, pack, publication)
        run: node scripts/preflight-publish.mjs
      - name: Publish (skipped when no NPM_TOKEN secret)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --access public --provenance
